# Desarrollo: catalogo + Oracle propio. Para EC2 usar infra/apps/compose.yml
services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: ms-catalog-db
    environment:
      ORACLE_PASSWORD: Admin123
      APP_USER: pedidos360
      APP_USER_PASSWORD: pedidos360
    ports:
      - "1523:1521"
    volumes:
      - oradata:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  catalog-app:
    build: .
    container_name: ms-catalog-app
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: oracle
      TZ: America/Santiago
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USERNAME: pedidos360
      DB_PASSWORD: pedidos360
    depends_on:
      oracle:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oradata:
