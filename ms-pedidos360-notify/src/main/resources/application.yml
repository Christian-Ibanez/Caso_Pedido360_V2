server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: ms-pedidos360-notify
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  # RabbitMQ (ec2-mq): nodos del cluster separados por coma
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:pedidos360}
    password: ${RABBITMQ_PASSWORD:pedidos360}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        # Si RabbitMQ no esta disponible al partir, el micro sigue reintentando conectarse
        missing-queues-fatal: false

app:
  messaging:
    # Errores recuperables (TransientProcessingException): intentos totales antes de mandar el mensaje a la DLQ,
    # con espera exponencial entre ellos (500 ms, 1 s, ...). Los errores no recuperables van directo a la DLQ.
    retry:
      max-attempts: ${MESSAGING_RETRY_MAX_ATTEMPTS:3}
      initial-backoff-ms: ${MESSAGING_RETRY_BACKOFF_MS:500}
      multiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

---
# Desarrollo local y tests: H2 en memoria
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:notifydb;DB_CLOSE_DELAY=-1
    username: sa
    password:

---
# Oracle: contenedor del compose (FREEPDB1), mismo usuario que los otros micros (tabla P360_NOTIFICATIONS)
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:pedidos360}
    password: ${DB_PASSWORD:pedidos360}
