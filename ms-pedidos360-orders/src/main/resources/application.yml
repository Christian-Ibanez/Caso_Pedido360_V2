server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ms-pedidos360-orders
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  # RabbitMQ (ec2-mq): varios nodos del cluster separados por coma
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USER:pedidos360}
    password: ${RABBITMQ_PASSWORD:pedidos360}
    connection-timeout: 3s
    publisher-returns: true
  # Kafka (ec2-kafka): los 3 brokers
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  cors:
    # Separar varios origenes con coma (5173 = Vite/React)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # false = no publica en Kafka/RabbitMQ (desarrollo sin brokers y tests)
  messaging:
    enabled: ${MESSAGING_ENABLED:false}
  # Coordinacion de stock con ms-pedidos360-catalog al aceptar/cancelar
  catalog:
    enabled: ${CATALOG_ENABLED:false}
    url: ${CATALOG_URL:http://localhost:8082}

---
# Desarrollo local: H2 en memoria (no necesita nada instalado)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:ordersdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true

---
# Oracle: contenedor del compose (FREEPDB1) o la base cloud
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:pedidos360}
    password: ${DB_PASSWORD:pedidos360}
