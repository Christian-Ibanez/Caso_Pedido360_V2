version: '3.8'

services:
  ms-pedidos360-bff:
    build:
      context: .
      dockerfile: Dockerfile
    image: ms-pedidos360-bff:latest
    container_name: ms-pedidos360-bff
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID:-85ffb3f2-fe8a-4eef-9c3d-f1f4983a31b6}
      - API_CLIENT_ID=${API_CLIENT_ID:-c11a2330-26f6-4d03-a29b-9f43c9f47078}
      - ORDERS_URL=${ORDERS_URL:-http://host.docker.internal:8081}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    restart: unless-stopped
