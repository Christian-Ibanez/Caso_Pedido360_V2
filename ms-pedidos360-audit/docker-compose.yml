# Desarrollo: audit con H2 en memoria, consumiendo un Kafka ya levantado (p. ej. infra/kafka/compose.yml en esta maquina).
# Para EC2 usar infra/apps/compose.yml (perfil oracle)
services:
  audit-app:
    build: .
    container_name: ms-audit-app
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: local
      TZ: America/Santiago
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
