# ec2-bff: solo el BFF (valida el JWT de Entra ID y enruta a los micros de ec2-apps por IP privada).
#   cp .env.example .env   (completar APPS_HOST con la IP privada de ec2-apps)
#   docker compose up -d --build
# El frontend (local) apunta a http://<IP_PUBLICA_EC2_BFF>:8080
services:
  bff:
    build: ../../ms-pedidos360-bff
    image: pedidos360/ms-pedidos360-bff
    container_name: bff
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: America/Santiago
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      API_CLIENT_ID: ${API_CLIENT_ID}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ORDERS_URL: http://${APPS_HOST}:8081
      CATALOG_URL: http://${APPS_HOST}:8082
      # Solo responden si ec2-apps levanta el perfil "kafka"
      AUDIT_URL: http://${APPS_HOST}:8084
      REPORT_URL: http://${APPS_HOST}:8086
      JAVA_OPTS: -XX:MaxRAMPercentage=75
