# Cluster de 2 nodos en ec2-mq (descubrimiento estatico por nombre de host)
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2

# Topologia del caso (exchanges, 3 colas + 3 DLQ, bindings) y usuario de la app
load_definitions = /etc/rabbitmq/definitions.json

# Los micros se conectan desde ec2-apps (el usuario guest solo sirve desde localhost)
loopback_users.guest = true
