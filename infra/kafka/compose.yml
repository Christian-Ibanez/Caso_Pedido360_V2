# ec2-kafka: 3 nodos Zookeeper + 3 brokers Kafka + Kafka UI + creacion de topicos.
#   KAFKA_PUBLIC_HOST=<IP privada de ec2-kafka> docker compose up -d   (o ponerlo en .env)
#   Bootstrap para los micros: <IP_EC2_KAFKA>:9092,<IP_EC2_KAFKA>:9093,<IP_EC2_KAFKA>:9094
#   Kafka UI: http://<IP_EC2_KAFKA>:8090
x-zookeeper: &zookeeper
  image: confluentinc/cp-zookeeper:7.6.1
  restart: unless-stopped
  environment: &zk-env
    ZOOKEEPER_CLIENT_PORT: 2181
    ZOOKEEPER_TICK_TIME: 2000
    ZOOKEEPER_INIT_LIMIT: 5
    ZOOKEEPER_SYNC_LIMIT: 2
    ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
    KAFKA_HEAP_OPTS: -Xms128m -Xmx256m

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  depends_on:
    - zookeeper1
    - zookeeper2
    - zookeeper3
  environment: &kafka-env
    KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
    # INTERNAL: entre brokers y Kafka UI (red de Docker). EXTERNAL: micros en ec2-apps
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_HEAP_OPTS: -Xms256m -Xmx512m

services:
  zookeeper1:
    <<: *zookeeper
    hostname: zookeeper1
    container_name: zookeeper1
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zk1-data:/var/lib/zookeeper/data

  zookeeper2:
    <<: *zookeeper
    hostname: zookeeper2
    container_name: zookeeper2
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 2
    volumes:
      - zk2-data:/var/lib/zookeeper/data

  zookeeper3:
    <<: *zookeeper
    hostname: zookeeper3
    container_name: zookeeper3
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 3
    volumes:
      - zk3-data:/var/lib/zookeeper/data

  kafka1:
    <<: *kafka
    hostname: kafka1
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://${KAFKA_PUBLIC_HOST:-localhost}:9092
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka2:
    <<: *kafka
    hostname: kafka2
    container_name: kafka2
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://${KAFKA_PUBLIC_HOST:-localhost}:9093
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka3:
    <<: *kafka
    hostname: kafka3
    container_name: kafka3
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://${KAFKA_PUBLIC_HOST:-localhost}:9094
    volumes:
      - kafka3-data:/var/lib/kafka/data

  # Crea los topicos del caso (idempotente) cuando los 3 brokers estan arriba y termina
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BS=kafka1:29092,kafka2:29092,kafka3:29092
        cub kafka-ready -b $$BS 3 180
        create() {
          kafka-topics --bootstrap-server $$BS --create --if-not-exists --topic "$$1" \
            --partitions 3 --replication-factor 3 --config min.insync.replicas=2 "$${@:2}"
        }
        # Eventos de negocio de pedidos: delete, 7 dias
        create orders.events --config cleanup.policy=delete --config retention.ms=604800000
        # Timeline de auditoria: compact,delete, 30 dias
        create audit.timeline --config cleanup.policy=compact,delete --config retention.ms=2592000000
        # Dead Letter Topics por consumidor: delete, 14 dias
        create orders.events.audit.DLT --config cleanup.policy=delete --config retention.ms=1209600000
        create orders.events.report.DLT --config cleanup.policy=delete --config retention.ms=1209600000
        kafka-topics --bootstrap-server $$BS --describe
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8090:8080"
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
      # Permite crear/editar/borrar topicos y configuraciones desde la UI
      DYNAMIC_CONFIG_ENABLED: "true"
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:-pedidos360}
    restart: unless-stopped

volumes:
  zk1-data:
  zk2-data:
  zk3-data:
  kafka1-data:
  kafka2-data:
  kafka3-data:
