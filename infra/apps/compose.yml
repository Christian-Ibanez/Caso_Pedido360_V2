# ec2-apps: microservicios + base de datos Oracle en la misma instancia.
#   cp .env.example .env   (completar la IP privada de ec2-mq)
#   docker compose up -d --build
# Levanta: oracle, orders-svc, catalog-svc, notify-svc.
# El BFF va en su propia instancia (infra/bff) y llega a orders/catalog/notify por la IP privada de esta instancia.
# audit-svc y report-svc consumen Kafka: solo se levantan con el perfil "kafka" cuando exista ec2-kafka
#   docker compose --profile kafka up -d --build   (y KAFKA_ENABLED=true + KAFKA_BOOTSTRAP_SERVERS en .env)
x-app: &app
  restart: unless-stopped
  environment: &app-env
    TZ: America/Santiago
    SPRING_PROFILES_ACTIVE: oracle
    DB_URL: ${DB_URL:-jdbc:oracle:thin:@//oracle:1521/FREEPDB1}
    DB_USERNAME: ${DB_USERNAME:-pedidos360}
    DB_PASSWORD: ${DB_PASSWORD:-pedidos360}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    JAVA_OPTS: -XX:MaxRAMPercentage=75
  depends_on:
    oracle:
      condition: service_healthy

services:
  # Base de datos de los micros (tablas con prefijo P360_). Puerto 1521 publicado para revisar con SQL Developer.
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:-Admin123}
      APP_USER: ${DB_USERNAME:-pedidos360}
      APP_USER_PASSWORD: ${DB_PASSWORD:-pedidos360}
    ports:
      - "1521:1521"
    volumes:
      - oradata:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  orders-svc:
    <<: *app
    build: ../../ms-pedidos360-orders
    image: pedidos360/ms-pedidos360-orders
    container_name: orders-svc
    ports:
      - "8081:8081"
    environment:
      <<: *app-env
      MESSAGING_ENABLED: "true"
      RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES}
      RABBITMQ_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}
      # Sin ec2-kafka: los comandos a RabbitMQ salen igual, solo se omite el evento en orders.events
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
      CATALOG_ENABLED: "true"
      CATALOG_URL: http://catalog-svc:8082

  catalog-svc:
    <<: *app
    build: ../../ms-pedidos360-catalog
    image: pedidos360/ms-pedidos360-catalog
    container_name: catalog-svc
    ports:
      - "8082:8082"

  # Consume RabbitMQ (correo, cocina, boleta y campana) y guarda las notificaciones de la campana en Oracle.
  # API /api/notifications solo para el BFF (el SG p360-apps abre 8083 solo desde p360-bff)
  notify-svc:
    <<: *app
    build: ../../ms-pedidos360-notify
    image: pedidos360/ms-pedidos360-notify
    container_name: notify-svc
    ports:
      - "8083:8083"
    environment:
      <<: *app-env
      RABBITMQ_ADDRESSES: ${RABBITMQ_ADDRESSES}
      RABBITMQ_USER: ${RABBITMQ_USER:-pedidos360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-pedidos360}

  # --- Solo con ec2-kafka (perfil "kafka") ---
  audit-svc:
    <<: *app
    profiles: ["kafka"]
    build: ../../ms-pedidos360-audit
    image: pedidos360/ms-pedidos360-audit
    container_name: audit-svc
    ports:
      - "8084:8084"
    environment:
      <<: *app-env
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

  report-svc:
    <<: *app
    profiles: ["kafka"]
    build: ../../ms-pedidos360-report
    image: pedidos360/ms-pedidos360-report
    container_name: report-svc
    ports:
      - "8086:8086"
    environment:
      <<: *app-env
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

volumes:
  oradata:
